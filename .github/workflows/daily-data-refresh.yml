# daily-data-refresh.yml

# Triggers a daily Vercel deployment to refresh restaurant inspection data
# without requiring a code change.

# Delegates all data fetching to `pipeline/fetch-inspections.mjs`,
# ensuring a single source of truth for the data generation pipeline.

name: Daily data refresh


on:
  schedule:
    # Runs at 06:00 UTC daily    
    - cron: "0 6 * * *"
  # Manual trigger option for testing or forcing an immediate site refresh.
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
