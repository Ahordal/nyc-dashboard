name: Daily data refresh

# Triggers a daily Vercel deployment to refresh inspection data without code changes.
# Delegates all data fetching to Vercel's build script (`pipeline/fetch-inspection.mjs`)
# to maintain a single source of truth for the data generation pipeline.
on:
  schedule:
    # Runs at 06:00 UTC daily    
    - cron: "0 6 * * *"
  # Manual trigger option for testing or forcing an immediate site refresh.
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
