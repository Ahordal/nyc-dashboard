name: Tests

# Runs the pipeline/*.test.mjs suite (node --test) and the src/**/*.test.ts
# suite (Vitest) so cache/normalize/scoring and frontend query/grade logic
# regressions get caught automatically, instead of relying on someone
# running these by hand.
#
# Read-only: doesn't touch the `data` branch, LocationIQ, or Vercel, so no
# secrets or write permissions are needed here.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline tests
        run: npm run test:pipeline

      - name: Run frontend tests
        run: npm run test:frontend