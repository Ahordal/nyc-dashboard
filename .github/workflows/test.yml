name: Tests

# Lint (JS/TS + CSS) + typecheck, then the pipeline/*.test.mjs suite (node
# --test) and the src/**/*.test.ts suite (Vitest), so a type error, lint
# failure, or cache/normalize/scoring/frontend regression fails the PR
# instead of only surfacing in the Vite build or by someone running these
# by hand.
#
# Read-only: doesn't touch the `data` branch, LocationIQ, or Vercel, so no
# secrets or write permissions are needed here.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Typecheck
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.node.json

      - name: Run pipeline tests
        run: npm run test:pipeline

      - name: Run frontend tests
        run: npm run test:frontend