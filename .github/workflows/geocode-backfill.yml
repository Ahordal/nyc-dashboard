name: Geocode Backfill

# Updates the geocoding cache with live DOHMH data. Commits to the `data`
# branch (avoiding `main` conflicts) and triggers a Vercel rebuild to deploy
# the fresh data. Orchestrating both here guarantees the cache is updated
# before the site rebuilds.
#
# Runs daily. Resolves up to ~4,900 new/changed restaurants to stay within
# LocationIQ's 5,000/day free tier. Cached entries are skipped automatically,
# allowing the script to progressively backfill the dataset over multiple days
# and then efficiently manage the daily trickle of new restaurants.

on:
  schedule:
    # 8:00 UTC daily (5:00 AM ADT)
    - cron: '0 8 * * *'
  workflow_dispatch: {} # Allows manual triggers via the Actions tab

# Explicit write permission is required. Without it, the default GITHUB_TOKEN
# is read-only and pushes will silently fail with a 403, losing the run's progress.
permissions:
  contents: write

# Prevents concurrent runs (e.g., scheduled vs. manual) from racing and
# corrupting the cache file.
concurrency:
  group: geocode-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Bumped to 240m. LocationIQ's 1s rate limit alone takes ~82m for 4,900
    # requests. The previous 120m timeout was too tight when combined with
    # DOHMH fetch latency. GitHub-hosted runners allow up to 360m.
    timeout-minutes: 240

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Pulls existing caches from the `data` branch. Without this, the pipeline
      # starts empty, ignores past progress, and repeatedly resolves the same
      # early slice of data on every run.
      - name: Seed cache from data branch
        run: |
          git fetch origin data
          git show origin/data:pipeline/geocode-cache.json > pipeline/geocode-cache.json 2>/dev/null || echo '{}' > pipeline/geocode-cache.json
          git show origin/data:pipeline/suspicious-shifts.json > pipeline/suspicious-shifts.json 2>/dev/null || echo '[]' > pipeline/suspicious-shifts.json
          # Previous daily run's totals -- run-geocode-backfill.mjs diffs this
          # run's counts against it to produce the Dashboard Information deltas.
          git show origin/data:pipeline/counts-snapshot.json > pipeline/counts-snapshot.json 2>/dev/null || echo '{}' > pipeline/counts-snapshot.json

      - name: Run geocode backfill
        working-directory: pipeline
        env:
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node run-geocode-backfill.mjs

      # Appends new resolutions to the `data` branch's cache.
      #
      # CAUTION: merge-and-commit-cache.mjs resets the working tree to the `data`
      # branch's orphan history partway through. Any subsequent steps expecting files
      # from `main` (like package.json or src/) will disappear and fail. Any new
      # steps requiring the repo files MUST be added before this step.
      - name: Commit updated cache to data branch
        if: always()
        working-directory: pipeline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node merge-and-commit-cache.mjs

      # Forces a Vercel rebuild so the site fetches the latest live DOHMH data.
      # Uses always() to ensure daily updates deploy even if the geocoding
      # step fails or produces no new cache entries.
      - name: Trigger Vercel deploy
        if: always()
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"