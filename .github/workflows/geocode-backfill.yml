name: Geocode Backfill

# Runs the geocoding backfill against live DOHMH data, commits the
# updated cache to the `data` branch -- never to `main`, so scheduled
# cache updates never conflict with in-progress dashboard work -- and
# then triggers a Vercel rebuild so the site picks up what was just
# committed. This is the ONLY workflow that calls LocationIQ, and the
# ONLY thing that pings the Vercel Deploy Hook -- keeping both in one
# workflow guarantees the rebuild always happens right after fresh data
# lands, in that order, every time. fetch-inspection.mjs (run during
# the Vercel build) only ever reads whatever this commits.
#
# Runs once daily. Each run resolves up to ~4,900 new/changed restaurants
# (LocationIQ's free tier is 5,000/day; kept a small buffer). Restaurants
# already resolved are skipped automatically via the cache, so this is
# resumable across days without any manual intervention -- during the
# initial backfill it'll take about a week to cover the full dataset, then
# settle into resolving only the small trickle of new/changed restaurants
# each day.

on:
  schedule:
    # 8:00 UTC daily (5:00 AM ADT)
    - cron: '0 8 * * *'
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

# The default GITHUB_TOKEN is read-only unless explicitly granted write
# access -- without this, the "Commit updated cache" step can create a
# commit locally on the runner but fails with a 403 when it tries to push,
# silently losing that run's entire geocoding progress.
permissions:
  contents: write

# Prevents overlapping runs (e.g. a manual trigger while the scheduled run
# is still in progress) from racing to write the cache file.
concurrency:
  group: geocode-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run geocode backfill
        working-directory: pipeline
        env:
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node run-geocode-backfill.mjs

      - name: Commit updated cache to data branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stop here if the backfill didn't actually change anything --
          # avoids empty "no-op" commits on days where nothing new
          # needed resolving. counts-snapshot.json is regenerated every
          # run regardless (it's cheap to recompute), so its presence
          # alone doesn't count as a "real" change here.
          git add -f pipeline/geocode-cache.json pipeline/suspicious-shifts.json pipeline/counts-snapshot.json
          git diff --cached -- pipeline/geocode-cache.json pipeline/suspicious-shifts.json --quiet && echo "No cache changes, skipping." && exit 0

          # Build a fresh orphan branch containing just the three cache/
          # snapshot files (not the whole dashboard tree) and force-push
          # it as `data`. This branch is bot-owned and fully replaced
          # every run -- nobody should build on it or expect stable
          # history.
          git checkout --orphan data-snapshot
          git rm -rf --cached . > /dev/null
          git add -f pipeline/geocode-cache.json pipeline/suspicious-shifts.json pipeline/counts-snapshot.json
          git commit -m "chore: update geocode cache and counts snapshot [automated]"
          git push origin data-snapshot:data --force

      # Runs regardless of whether the backfill or commit steps above
      # succeeded, failed, or found nothing new to commit -- the site
      # should still refresh daily against the latest live DOHMH data
      # even on a day where geocoding didn't produce any cache changes,
      # or hit an error. Vercel's own build re-fetches inspection data
      # independently, so a rebuild is still worthwhile even when this
      # job's own fetch had trouble.
      - name: Trigger Vercel deploy
        if: always()
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"