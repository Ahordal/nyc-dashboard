<!-- index.html -->

<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LFLC1PZHFG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-LFLC1PZHFG');
    </script>

    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>NYC Restaurant Inspection Grades &amp; Trends</title>
    <meta
      name="description"
      content="Explore health inspection grades, scores, and violation history for roughly %RESTAURANT_COUNT% NYC restaurants across all five boroughs, mapped from NYC Open Data."
    />
    <link rel="canonical" href="https://nyc.alexhordal.ca/" />
    <meta name="theme-color" content="#212121" />

    <!-- Open Graph / Twitter: static so links unfurl without running JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NYC Restaurant Inspections" />
    <meta property="og:title" content="NYC Restaurant Inspection Grades &amp; Trends" />
    <meta
      property="og:description"
      content="Explore health inspection grades, scores, and violation history for roughly %RESTAURANT_COUNT% NYC restaurants across all five boroughs, mapped from NYC Open Data."
    />
    <meta property="og:url" content="https://nyc.alexhordal.ca/" />
    <meta property="og:image" content="https://nyc.alexhordal.ca/og-image.png" />
    <meta
      property="og:image:alt"
      content="Title card reading Dining Under the Microscope, with a donut chart of NYC restaurant inspection grades."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NYC Restaurant Inspection Grades &amp; Trends" />
    <meta
      name="twitter:description"
      content="Health inspection grades, scores, and violation history for roughly %RESTAURANT_COUNT% NYC restaurants, mapped from NYC Open Data."
    />
    <meta name="twitter:image" content="https://nyc.alexhordal.ca/og-image.png" />

    <!-- Structured data: helps search engines surface this as an app
         and (via Dataset) makes it discoverable through dataset search,
         separate from the underlying NYC Open Data source. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NYC Restaurant Inspection Grades & Trends",
        "url": "https://nyc.alexhordal.ca/",
        "description": "Explore health inspection grades, scores, and violation history for roughly %RESTAURANT_COUNT% NYC restaurants across all five boroughs, mapped from NYC Open Data.",
        "applicationCategory": "DataVisualizationApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "author": {
          "@type": "Person",
          "name": "Alex Hordal",
          "url": "https://alexhordal.ca"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dataset",
        "name": "NYC Restaurant Inspection Results (mapped)",
        "description": "Health inspection grades, scores, and violation history for roughly %RESTAURANT_COUNT% NYC restaurants, geocoded and mapped from the DOHMH New York City Restaurant Inspection Results dataset.",
        "url": "https://nyc.alexhordal.ca/",
        "license": "https://opendata.cityofnewyork.us/overview/#termsofuse",
        "creator": {
          "@type": "Person",
          "name": "Alex Hordal",
          "url": "https://alexhordal.ca"
        },
        "spatialCoverage": {
          "@type": "Place",
          "name": "New York City, NY"
        },
        "isBasedOn": {
          "@type": "Dataset",
          "name": "DOHMH New York City Restaurant Inspection Results",
          "url": "https://data.cityofnewyork.us/Health/DOHMH-New-York-City-Restaurant-Inspection-Results/43nn-pn8j/about_data"
        }
      }
    </script>

    <!-- Self-hosted from /fonts/ (styles/base.css) — no third-party
         request, no render-blocking stylesheet. Only above-the-fold faces
         preload (rest load on demand, font-display: swap); crossorigin is
         mandatory even for same-origin font preloads. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/public-sans-v21-latin_latin-ext-regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/public-sans-v21-latin_latin-ext-700.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/archivo-v25-latin_latin-ext-700.woff2" crossorigin />

    <!-- Basemap tiles come from here once MapView lazy-loads; resolves
         DNS early without opening a connection. -->
    <link rel="dns-prefetch" href="https://basemaps-api.arcgis.com" />

    <!-- Small JSON fetched on mount — without this hint it wouldn't start
         until React mounts, ~1.7s deep in the critical path (Lighthouse).
         Preloaded alongside the app JS; fetch() reuses the response, and
         crossorigin is required for as="fetch" to match. -->
    <link rel="preload" as="fetch" type="application/json" href="/data/dashboard-meta.json" crossorigin />
    <link rel="preload" as="fetch" type="application/json" href="/data/violation-codes.json" crossorigin />

    <!-- The largest download — otherwise wouldn't start until React
         mounts and MapView's chunk parses. Low-priority preload, so it
         yields to the critical resources above; GeoJSONLayer's fetch()
         reuses the response (crossorigin required to match). -->
    <link
      rel="preload"
      as="fetch"
      type="application/geo+json"
      href="/data/latest-inspections.geojson"
      fetchpriority="low"
      crossorigin
    />
  </head>
  <body>
    <!-- Replaced by the React app on mount; kept as real markup (not
         noscript) so crawlers see content before JS runs. Visually
         hidden inline (not via the stylesheet) so it never flashes
         unstyled before the app's own CSS/JS take over. -->
    <div id="root">
      <div style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0">
        <h1>NYC Restaurant Inspection Grades &amp; Trends</h1>
        <p>
          Explore health inspection grades, scores, and violation history for
          roughly %RESTAURANT_COUNT% NYC restaurants across all five boroughs, mapped from
          <a href="https://data.cityofnewyork.us/Health/DOHMH-New-York-City-Restaurant-Inspection-Results/43nn-pn8j"
            >NYC Open Data</a
          >.
        </p>
      </div>
    </div>
    <noscript>
      <p>This dashboard requires JavaScript to render the interactive map and charts.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
