<!-- Index.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>NYC Restaurant Inspection Grades &amp; Trends</title>
    <meta
      name="description"
      content="Explore health inspection grades, scores, and violation history for roughly 27,000 NYC restaurants across all five boroughs, mapped from NYC Open Data."
    />
    <link rel="canonical" href="https://nyc.alexhordal.ca/" />
    <meta name="theme-color" content="#212121" />

    <!-- Open Graph / Twitter: static so links unfurl without running JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NYC Restaurant Inspections" />
    <meta property="og:title" content="NYC Restaurant Inspection Grades &amp; Trends" />
    <meta
      property="og:description"
      content="Explore health inspection grades, scores, and violation history for roughly 27,000 NYC restaurants across all five boroughs, mapped from NYC Open Data."
    />
    <meta property="og:url" content="https://nyc.alexhordal.ca/" />
    <meta property="og:image" content="https://nyc.alexhordal.ca/og-image.png" />
    <meta
      property="og:image:alt"
      content="Title card reading Dining Under the Microscope, with a donut chart of NYC restaurant inspection grades."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NYC Restaurant Inspection Grades &amp; Trends" />
    <meta
      name="twitter:description"
      content="Health inspection grades, scores, and violation history for roughly 27,000 NYC restaurants, mapped from NYC Open Data."
    />
    <meta name="twitter:image" content="https://nyc.alexhordal.ca/og-image.png" />

    <!-- Fonts loaded here rather than via @import in global.css: a <link>
         in <head> lets the browser start the fetch immediately instead of
         waiting for the stylesheet to download and parse first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Archivo:wght@600;700;800&display=swap"
    />

    <!-- Map basemap tiles come from here once MapView lazy-loads; resolve
         DNS early without holding a connection open pre-emptively. -->
    <link rel="dns-prefetch" href="https://basemaps-api.arcgis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
